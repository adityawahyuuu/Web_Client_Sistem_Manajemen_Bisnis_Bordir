name: CI/CD - Web

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: self-hosted
    defaults:
      run:
        # Windows PowerShell 5.1 — this runner doesn't have pwsh (PowerShell
        # Core) installed. `shell: bash` breaks here: the runner hands bash a
        # Windows-style temp script path (D:\...\xxx.sh) and bash eats the
        # backslashes as escape characters, corrupting the path.
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    env:
      COMPOSE_DIR: 'D:\gawe\Full Stack - Patchwork_Invoice_System'
      IMAGE_TAG: patchwork-invoice-system-web:latest
      # Vite bakes these into the JS bundle at build time (see Dockerfile) —
      # they're public URLs, not secrets, so plain env vars here are fine.
      VITE_API_BASE_URL: https://stg.entitypradhana.id
      VITE_API_PREFIX: /patchwork/api
      VITE_WEB_BASE_PATH: /patchwork/web
    steps:
      - uses: actions/checkout@v4

      # Tagged to match what docker-compose.yml expects for this service, so
      # the `docker compose up` step below reuses this image instead of
      # rebuilding from the old on-disk checkout.
      - name: Build Docker image
        run: |
          docker build -t $env:IMAGE_TAG `
            --build-arg VITE_API_BASE_URL=$env:VITE_API_BASE_URL `
            --build-arg VITE_API_PREFIX=$env:VITE_API_PREFIX `
            --build-arg VITE_WEB_BASE_PATH=$env:VITE_WEB_BASE_PATH `
            .

      - name: Deploy (recreate container with the new image)
        run: |
          Set-Location $env:COMPOSE_DIR
          docker compose up -d web

      - name: Health check
        run: |
          Start-Sleep -Seconds 3
          $response = Invoke-WebRequest -Uri "http://localhost:5173/patchwork/web/" -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            throw "Health check failed: $($response.StatusCode)"
          }
          Write-Output "Health check OK"
